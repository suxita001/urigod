<link rel="stylesheet" href="css/chatbot.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">

<style>
/* ── Base ─────────────────────────────────────────────── */
html, body { height: 100%; overflow: hidden; margin: 0; }
.map-page  { height: 100vh; display: flex; flex-direction: column; position: relative; }
#fullMap   { flex: 1; width: 100%; }

/* ── CSS Variables ────────────────────────────────────── */
:root {
  --panel-w: 292px;
  --panel-r: 286px;
  --collapse-size: 44px;
  --panel-radius: 18px;
  --glass-dark: rgba(8,8,8,.92);
  --glass-light: rgba(245,244,240,.94);
  --trans: cubic-bezier(.4,0,.2,1);
}

/* ── Shared panel skin ────────────────────────────────── */
.mp {
  position: absolute;
  z-index: 500;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border: 1px solid var(--bdr);
  background: var(--glass-dark);
  transition:
    width .35s var(--trans),
    height .35s var(--trans),
    border-radius .35s var(--trans),
    opacity .25s,
    transform .35s var(--trans);
}
body.light .mp { background: var(--glass-light); }

/* ── LEFT panel ───────────────────────────────────────── */
.mp-left {
  top: calc(var(--nav-h) + 14px);
  left: 14px;
  width: var(--panel-w);
  border-radius: var(--panel-radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - var(--nav-h) - 28px);
}
.mp-left.collapsed {
  width: var(--collapse-size);
  height: var(--collapse-size);
  border-radius: 50%;
  overflow: hidden;
}
.mp-left.collapsed .mp-body,
.mp-left.collapsed .mp-footer { display: none; }

/* ── RIGHT panel ──────────────────────────────────────── */
.mp-right {
  top: calc(var(--nav-h) + 14px);
  right: 14px;
  width: var(--panel-r);
  border-radius: var(--panel-radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - var(--nav-h) - 28px);
}
.mp-right.collapsed {
  width: var(--collapse-size);
  height: var(--collapse-size);
  border-radius: 50%;
  overflow: hidden;
}
.mp-right.collapsed .mp-body { display: none; }

/* ── Panel header (always visible) ─────────────────────── */
.mp-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  flex-shrink: 0;
  min-height: var(--collapse-size);
  cursor: default;
}
.mp-head-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: var(--t2);
  white-space: nowrap;
  overflow: hidden;
  opacity: 1;
  transition: opacity .2s;
}
.mp-left.collapsed  .mp-head-label,
.mp-right.collapsed .mp-head-label { opacity: 0; width: 0; }

/* Collapse / expand button */
.mp-toggle {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--glass2);
  border: 1px solid var(--bdr);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--t2);
  font-size: 14px;
  flex-shrink: 0;
  transition: background .2s, border-color .2s, transform .3s var(--trans);
  outline: none;
}
.mp-toggle:hover { background: var(--glass2); border-color: var(--bdr-cyan); color: var(--cyan); }
/* When collapsed the whole header is just the toggle button centered */
.mp-left.collapsed  .mp-toggle,
.mp-right.collapsed .mp-toggle {
  width: var(--collapse-size);
  height: var(--collapse-size);
  border-radius: 50%;
  background: var(--cyan);
  border-color: var(--cyan);
  color: #080808;
  font-size: 18px;
  margin: 0 auto;
}
.mp-left.collapsed  .mp-head,
.mp-right.collapsed .mp-head {
  padding: 0;
  justify-content: center;
}

/* ── Panel body (scrollable) ────────────────────────────── */
.mp-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 14px 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--bdr2) transparent;
}
.mp-body::-webkit-scrollbar { width: 4px; }
.mp-body::-webkit-scrollbar-thumb { background: var(--bdr2); border-radius: 2px; }

/* ── Panel footer ────────────────────────────────────────── */
.mp-footer {
  padding: 10px 14px 14px;
  flex-shrink: 0;
  border-top: 1px solid var(--bdr);
}

/* ── Divider ────────────────────────────────────────────── */
.mp-divider {
  height: 1px;
  background: var(--bdr);
  margin: 10px 0;
}

/* ── Search box ─────────────────────────────────────────── */
.mp-search {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--bdr);
  flex-shrink: 0;
}
.mp-search input {
  background: none; border: none; outline: none;
  color: var(--t1); font-size: 14px; flex: 1;
  font-family: inherit;
}
.mp-search input::placeholder { color: var(--t3); }

/* ── Filter section label ───────────────────────────────── */
.fl-lbl {
  font-size: 11px; font-weight: 700;
  letter-spacing: .7px; text-transform: uppercase;
  color: var(--t3); margin-bottom: 8px;
  display: flex; align-items: center; justify-content: space-between;
}

/* Category chips — vertical list ──────────────────────── */
.cat-chips {
  display: flex; flex-direction: column; gap: 4px;
  max-height: 160px; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--bdr2) transparent;
  margin-bottom: 4px;
}
.cat-chips::-webkit-scrollbar { width: 3px; }
.cat-chips::-webkit-scrollbar-thumb { background: var(--bdr2); border-radius: 2px; }

.cat-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 10px;
  font-size: 13px; font-weight: 500;
  background: var(--glass); border: 1px solid var(--bdr);
  color: var(--t2); cursor: pointer;
  transition: background .18s, border-color .18s, color .18s;
  text-align: left; white-space: nowrap;
}
.cat-chip:hover { background: var(--glass2); color: var(--t1); }
.cat-chip.sel   { background: var(--cyan-d); border-color: var(--bdr-cyan); color: var(--cyan); }

/* Cat search mini input */
.cat-search-in {
  width: 100%;
  background: var(--glass);
  border: 1px solid var(--bdr);
  border-radius: 8px;
  padding: 6px 10px;
  color: var(--t1); font-size: 12px;
  outline: none; font-family: inherit;
  margin-bottom: 6px;
  transition: border-color .2s;
}
.cat-search-in:focus { border-color: var(--bdr-cyan); }
.cat-search-in::placeholder { color: var(--t3); }

/* ── Dual range slider ──────────────────────────────────── */
.dual-wrap { position: relative; height: 20px; margin: 6px 0 4px; }
.dual-track {
  position: absolute; top: 50%; transform: translateY(-50%);
  left: 0; right: 0; height: 4px;
  background: var(--bdr); border-radius: 2px;
}
.dual-fill {
  position: absolute; top: 50%; transform: translateY(-50%);
  height: 4px; background: var(--cyan); border-radius: 2px;
  pointer-events: none;
}
.dual-wrap input[type=range] {
  position: absolute; width: 100%;
  top: 50%; transform: translateY(-50%);
  appearance: none; -webkit-appearance: none;
  background: none; pointer-events: none; margin: 0; outline: none;
}
.dual-wrap input[type=range]::-webkit-slider-thumb {
  pointer-events: auto; -webkit-appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--cyan); border: 2px solid var(--bg);
  cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.35);
  transition: transform .2s;
}
.dual-wrap input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
.dual-wrap input[type=range]::-moz-range-thumb {
  pointer-events: auto; width: 16px; height: 16px; border-radius: 50%;
  background: var(--cyan); border: 2px solid var(--bg); cursor: pointer;
}

/* ── Checkbox row ───────────────────────────────────────── */
.chk-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--t2); cursor: pointer;
  transition: color .2s; padding: 4px 0;
}
.chk-row:hover { color: var(--t1); }
.chk-row input { width: 14px; height: 14px; accent-color: var(--cyan); }

/* ── Reset button ───────────────────────────────────────── */
.reset-btn {
  width: 100%; padding: 9px;
  background: transparent; border: 1px solid var(--bdr);
  border-radius: 10px; color: var(--t2); font-size: 12px;
  cursor: pointer; font-weight: 600; font-family: inherit;
  transition: border-color .2s, color .2s, background .2s;
}
.reset-btn:hover { border-color: var(--bdr-cyan); color: var(--cyan); background: var(--cyan-d); }

/* ── List (right panel) ─────────────────────────────────── */
.map-item {
  padding: 11px 12px; border-radius: 13px;
  cursor: pointer; transition: background .2s, border-color .2s;
  border: 1px solid transparent; margin-bottom: 5px;
}
.map-item:last-child { margin-bottom: 0; }
.map-item:hover  { background: var(--glass2); border-color: var(--bdr); }
.map-item.active { background: var(--cyan-d);  border-color: var(--bdr-cyan); }
.mi-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.mi-emoji  { font-size: 20px; flex-shrink: 0; }
.mi-name   { font-size: 13px; font-weight: 700; }
.mi-cui    { font-size: 11px; color: var(--t2); }
.mi-rating { margin-left: auto; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 3px; }
.mi-addr   { font-size: 12px; color: var(--t3); margin-bottom: 4px; }
.mi-foot   { display: flex; align-items: center; justify-content: space-between; }
.mi-hours  { font-size: 11px; color: var(--t3); }
.mi-status { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 100px; }
.s-open    { background: var(--cyan-d); color: var(--cyan); }
.s-closed  { background: var(--red-d);  color: var(--red);  }

/* ── Fit-all button ─────────────────────────────────────── */
.fit-btn {
  width: 100%; padding: 10px;
  background: var(--glass); border: 1px solid var(--bdr);
  border-radius: 10px; color: var(--t1); font-size: 13px;
  font-weight: 600; cursor: pointer; font-family: inherit;
  transition: border-color .2s, color .2s;
}
.fit-btn:hover { border-color: var(--bdr-cyan); color: var(--cyan); }

/* ── Empty state ────────────────────────────────────────── */
.list-empty {
  text-align: center; padding: 32px 12px;
  font-size: 13px; color: var(--t3); line-height: 1.6;
}
.list-empty-ico { font-size: 40px; margin-bottom: 10px; }

/* ══ MOBILE ( ≤ 768px ) ════════════════════════════════════ */
@media (max-width: 768px) {
  /* Hide desktop panels */
  .mp-left, .mp-right { display: none !important; }

  /* Bottom sheet shared */
  .bs {
    position: fixed;
    left: 0; right: 0;
    z-index: 600;
    background: var(--bg3);
    border-top: 1px solid var(--bdr);
    border-radius: 20px 20px 0 0;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: transform .38s cubic-bezier(.4,0,.2,1);
    touch-action: none;
  }
  body.light .bs { background: var(--glass-light); }

  /* Filter sheet */
  .bs-filter {
    bottom: 0;
    max-height: 75vh;
    transform: translateY(calc(100% - 58px)); /* shows pill */
  }
  .bs-filter.expanded { transform: translateY(0); }

  /* List sheet */
  .bs-list {
    bottom: 0;
    max-height: 60vh;
    transform: translateY(calc(100% - 52px));
  }
  .bs-list.expanded { transform: translateY(0); }

  /* Two sheets can't both be fully open — list sits above filter */
  .bs-filter { z-index: 601; }
  .bs-list   { z-index: 602; }

  /* Pill handle */
  .bs-handle {
    width: 36px; height: 4px;
    background: var(--bdr2); border-radius: 2px;
    margin: 10px auto 0;
  }

  /* Sheet header */
  .bs-head {
    padding: 6px 16px 12px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
  }
  .bs-head-label {
    font-size: 13px; font-weight: 700; color: var(--t1);
    display: flex; align-items: center; gap: 8px;
  }
  .bs-head-count {
    font-size: 11px; font-weight: 600;
    background: var(--cyan-d); color: var(--cyan);
    border: 1px solid var(--bdr-cyan);
    padding: 2px 8px; border-radius: 100px;
  }
  .bs-head-arrow {
    font-size: 18px; color: var(--t3);
    transition: transform .3s;
  }
  .bs-filter.expanded .bs-head-arrow,
  .bs-list.expanded   .bs-head-arrow { transform: rotate(180deg); }

  /* Sheet body */
  .bs-body {
    overflow-y: auto; overflow-x: hidden;
    max-height: calc(75vh - 80px);
    padding: 0 16px 20px;
    scrollbar-width: thin;
  }

  /* Mobile search bar (fixed top) */
  .mob-search {
    position: fixed;
    top: calc(var(--nav-h) + 8px);
    left: 12px; right: 12px;
    z-index: 599;
    background: var(--glass-dark);
    border: 1px solid var(--bdr);
    border-radius: 12px;
    backdrop-filter: blur(16px);
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
  }
  body.light .mob-search { background: var(--glass-light); }
  .mob-search input {
    background: none; border: none; outline: none;
    color: var(--t1); font-size: 14px; flex: 1;
    font-family: inherit;
  }
  .mob-search input::placeholder { color: var(--t3); }

  /* Fit-all FAB */
  .mob-fit {
    position: fixed;
    top: calc(var(--nav-h) + 58px);
    right: 12px;
    z-index: 599;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--glass-dark); border: 1px solid var(--bdr);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer;
    transition: border-color .2s;
  }
  body.light .mob-fit { background: var(--glass-light); }
  .mob-fit:hover { border-color: var(--bdr-cyan); }
}

/* ── Leaflet popup theme ────────────────────────────────── */
.ug-popup .leaflet-popup-content-wrapper {
  background: var(--bg3) !important;
  border: 1px solid var(--bdr2) !important;
  border-radius: 16px !important;
  color: var(--t1) !important;
  box-shadow: 0 20px 60px rgba(0,0,0,.55) !important;
  padding: 0 !important;
}
.ug-popup .leaflet-popup-tip { background: var(--bg3) !important; }
.ug-popup .leaflet-popup-content { margin: 16px 18px !important; }
.leaflet-control-zoom a { background: var(--bg3) !important; color: var(--t1) !important; border-color: var(--bdr2) !important; }
</style>
</head>

<script>

// ── State ─────────────────────────────────────────────────
let activeCuisines = [], minRating = 0, maxRating = 5, onlyOpen = false, searchQ = '';

// ── Panel collapse (desktop) ──────────────────────────────
const panelState = { left: false, right: false }; // false = open

function togglePanel(side) {
  const panel  = document.getElementById(side === 'left' ? 'panelLeft' : 'panelRight');
  const toggle = document.getElementById(side === 'left' ? 'pl-toggle' : 'pr-toggle');
  const isNowCollapsed = !panelState[side];
  panelState[side] = isNowCollapsed;

  if (isNowCollapsed) {
    panel.classList.add('collapsed');
    toggle.textContent = side === 'left' ? '🎛️' : '🏠';
    toggle.title = side === 'left' ? 'gaaxsnا' : 'gaaxsna';
    // clicking the collapsed dot re-opens
    panel.onclick = (e) => {
      if (panelState[side]) { togglePanel(side); e.stopPropagation(); }
    };
  } else {
    panel.classList.remove('collapsed');
    toggle.textContent = '✕';
    toggle.title = 'dakerva';
    panel.onclick = null;
  }
}

// ── Sheet expand (mobile) ─────────────────────────────────
const sheetState = { filter: false, list: false };

function toggleSheet(name) {
  const el = document.getElementById(name === 'filter' ? 'bsFilter' : 'bsList');
  const isNowExpanded = !sheetState[name];
  sheetState[name] = isNowExpanded;
  el.classList.toggle('expanded', isNowExpanded);
}

// ── Responsive: switch desktop ↔ mobile ──────────────────
function applyResponsive() {
  const mob = window.innerWidth <= 768;

  // Desktop panels
  document.getElementById('panelLeft').style.display  = mob ? 'none' : '';
  document.getElementById('panelRight').style.display = mob ? 'none' : '';

  // Mobile elements
  document.getElementById('mobSearch').style.display = mob ? 'flex' : 'none';
  document.getElementById('mobFit').style.display    = mob ? 'flex' : 'none';
  document.getElementById('bsFilter').style.display  = mob ? 'block' : 'none';
  document.getElementById('bsList').style.display    = mob ? 'block' : 'none';

  if (mob) buildMobileFilter();
}

// ── Category chips ────────────────────────────────────────
function buildChips(targetId) {
  const L  = LANG_GET();
  const id = targetId || 'mapChips';
  const q  = (document.getElementById(id === 'mapChips' ? 'catSearch' : 'mobCatSearch')?.value || '').toLowerCase();
  let html = '';

  if (!q) {
    const allSel = activeCuisines.length === 0;
    html += `<button class="cat-chip${allSel?' sel':''}" onclick="toggleCuisine('all','${targetId||''}')">
      🍽️ ${L==='en'?'All':'ყველა'}
    </button>`;
  }
  CATEGORIES.forEach(c => {
    if (c.id === 'all') return;
    const name = L === 'en' ? c.en : c.ka;
    if (!name.toLowerCase().includes(q)) return;
    const sel = activeCuisines.includes(c.id);
    html += `<button class="cat-chip${sel?' sel':''}" onclick="toggleCuisine('${c.id}','${targetId||''}')">
      ${c.emoji} ${name}
    </button>`;
  });
  const el = document.getElementById(id);
  if (el) el.innerHTML = html;
}

function toggleCuisine(id, targetId) {
  if (id === 'all') activeCuisines = [];
  else {
    const i = activeCuisines.indexOf(id);
    if (i >= 0) activeCuisines.splice(i, 1);
    else activeCuisines.push(id);
  }
  buildChips('mapChips');
  buildChips('mobCatChips');
  runFilters();
}

// ── Rating slider ─────────────────────────────────────────
function updateSlider(fromMob) {
  const mn = parseFloat(document.getElementById(fromMob ? 'mobRMin' : 'rMin')?.value || 0);
  const mx = parseFloat(document.getElementById(fromMob ? 'mobRMax' : 'rMax')?.value || 5);
  minRating = Math.min(mn, mx);
  maxRating = Math.max(mn, mx);

  // Sync both sliders
  ['rMin','mobRMin'].forEach(id => { const el = document.getElementById(id); if(el) el.value = minRating; });
  ['rMax','mobRMax'].forEach(id => { const el = document.getElementById(id); if(el) el.value = maxRating; });

  const label = `${minRating.toFixed(1)} – ${maxRating.toFixed(1)} ★`;
  ['rValLbl','mobRValLbl'].forEach(id => { const el = document.getElementById(id); if(el) el.textContent = label; });

  const pct1 = (minRating/5)*100, pct2 = (maxRating/5)*100;
  ['dualFill','mobDualFill'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.style.left = pct1+'%'; el.style.width = (pct2-pct1)+'%'; }
  });
  runFilters();
}

// ── Reset ─────────────────────────────────────────────────
function resetFilters() {
  activeCuisines = []; minRating = 0; maxRating = 5; onlyOpen = false; searchQ = '';
  ['rMin','rMax','mobRMin','mobRMax'].forEach((id,i) => { const el=document.getElementById(id); if(el) el.value=i%2?5:0; });
  ['onlyOpen','mobOnlyOpen'].forEach(id => { const el=document.getElementById(id); if(el) el.checked=false; });
  ['mapSearch','mobSearchIn'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  ['catSearch'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  updateSlider();
  buildChips('mapChips');
  buildChips('mobCatChips');
  runFilters();
}

// ── Main filter logic ─────────────────────────────────────
function runFilters() {
  let list = [...RESTAURANTS];
  if (activeCuisines.length) list = list.filter(r => activeCuisines.includes(r.cuisineTag));
  list = list.filter(r => r.rating >= minRating && r.rating <= maxRating);
  if (onlyOpen) list = list.filter(r => r.status === 'open');
  if (searchQ) {
    const q = searchQ;
    list = list.filter(r =>
      tl(r.name).toLowerCase().includes(q) ||
      tl(r.cuisine).toLowerCase().includes(q) ||
      r.branches.some(b => tl(b.address).toLowerCase().includes(q))
    );
  }
  buildList(list);
  UrigodMap.render(list);
}

// ── List render ───────────────────────────────────────────
function buildList(data) {
  const ka    = LANG_GET() === 'ka';
  const total = data.reduce((s,r) => s + r.branches.length, 0);

  // update count badges
  ['pr-count','bs-count'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = total;
  });

  const html = data.length ? data.flatMap(r =>
    r.branches.map(b => {
      const open = b.status === 'open';
      return `
        <div class="map-item" onclick="selectBranch(${b.lat},${b.lng},this)">
          <div class="mi-top">
            <span class="mi-emoji">${r.emoji}</span>
            <div style="flex:1;min-width:0">
              <div class="mi-name">${tl(b.name)}</div>
              <div class="mi-cui">${tl(r.cuisine)}</div>
            </div>
            <div class="mi-rating"><span class="star">★</span>${r.rating}</div>
          </div>
          <div class="mi-addr">📍 ${tl(b.address)}</div>
          <div class="mi-foot">
            <span class="mi-hours">🕐 ${b.hours}</span>
            <span class="mi-status ${open?'s-open':'s-closed'}">
              ${open?(ka?'● ɣiaa':'● Open'):(ka?'● daxur.':'● Closed')}
            </span>
          </div>
        </div>`;
    })
  ).join('') : `<div class="list-empty"><div class="list-empty-ico">🍽️</div>${ka?'ვer moiZebna':'Not found'}</div>`;

  document.getElementById('mapList').innerHTML     = html;
  document.getElementById('bsListBody').innerHTML  = html;
}

function selectBranch(lat, lng, el) {
  document.querySelectorAll('.map-item').forEach(e => e.classList.remove('active'));
  if (el) el.classList.add('active');
  UrigodMap.flyTo(lat, lng, 16);
  // Collapse list sheet after selection on mobile
  if (window.innerWidth <= 768 && sheetState.list) toggleSheet('list');
}

// ── Mobile filter sheet content ───────────────────────────
function buildMobileFilter() {
  const ka = LANG_GET() === 'ka';
  document.getElementById('bsFilterBody').innerHTML = `
    <div style="margin-bottom:12px">
      <div class="fl-lbl" style="margin-bottom:6px">${ka?'სamzareuło':'Cuisine'}</div>
      <input class="cat-search-in" id="mobCatSearch"
        placeholder="${ka?'🔍 kategorIa...':'🔍 Category...'}"
        oninput="buildChips('mobCatChips')">
      <div class="cat-chips" id="mobCatChips" style="max-height:130px"></div>
    </div>

    <div class="mp-divider"></div>

    <div style="margin-bottom:12px">
      <div class="fl-lbl">
        <span>${ka?'reItIngI':'Rating'}</span>
        <span id="mobRValLbl" style="color:var(--cyan);font-weight:800">${minRating.toFixed(1)} – ${maxRating.toFixed(1)} ★</span>
      </div>
      <div class="dual-wrap">
        <div class="dual-track"></div>
        <div class="dual-fill" id="mobDualFill" style="left:${minRating/5*100}%;width:${(maxRating-minRating)/5*100}%"></div>
        <input type="range" id="mobRMin" min="0" max="5" step="0.1" value="${minRating}" oninput="updateSlider(true)">
        <input type="range" id="mobRMax" min="0" max="5" step="0.1" value="${maxRating}" oninput="updateSlider(true)">
      </div>
    </div>

    <div class="mp-divider"></div>

    <label class="chk-row" style="margin-bottom:14px">
      <input type="checkbox" id="mobOnlyOpen" ${onlyOpen?'checked':''} onchange="onlyOpen=this.checked;runFilters()">
      ${ka?'🟢 mxolod Ria':'🟢 Open only'}
    </label>

    <button class="reset-btn" onclick="resetFilters()">${ka?'🔄 gasufThaveba':'🔄 Reset'}</button>
  `;
  buildChips('mobCatChips');
}

// ── i18n ──────────────────────────────────────────────────
function applyI18n() {
  const ka = LANG_GET() === 'ka';
  document.getElementById('pl-lbl-txt').textContent = ka ? 'ფილტრები' : 'Filters';
  document.getElementById('pr-lbl-txt').textContent = ka ? 'რესტორნები' : 'Restaurants';
  document.getElementById('l-cat').textContent      = ka ? 'სამზარეულო' : 'Cuisine';
  document.getElementById('l-rating').textContent   = ka ? 'რეიტინგი' : 'Rating';
  document.getElementById('l-status').textContent   = ka ? 'სტატუსი' : 'Status';
  document.getElementById('l-open').textContent     = ka ? '🟢 მხოლოდ ღია' : '🟢 Open only';
  document.getElementById('l-reset').textContent    = ka ? '🔄 გადაფუთვა' : '🔄 Reset';
  document.getElementById('l-fit').textContent      = ka ? '↔ ყველა ნახვა' : '↔ Fit All';
  document.getElementById('mapSearch').placeholder  = ka ? 'მოძებნა...' : 'Search...';
  document.getElementById('catSearch').placeholder  = ka ? '🔍 კატეგორია...' : '🔍 Category...';
  document.getElementById('bs-fl-txt').textContent  = ka ? 'ფილტრები' : 'Filters';
  document.getElementById('bs-li-txt').textContent  = ka ? 'რესტორნები' : 'Restaurants';

  buildChips('mapChips');
  if (window.innerWidth <= 768) buildMobileFilter();
  runFilters();
}
window.rerender = applyI18n;

// ── Events ─────────────────────────────────────────────────
document.getElementById('mapSearch').addEventListener('input', e => {
  searchQ = e.target.value.toLowerCase(); runFilters();
});
document.getElementById('catSearch').addEventListener('input', () => buildChips('mapChips'));
document.getElementById('onlyOpen').addEventListener('change', e => { onlyOpen = e.target.checked; runFilters(); });

// Mobile search
document.getElementById('mobSearchIn').addEventListener('input', e => {
  searchQ = e.target.value.toLowerCase(); runFilters();
  // sync desktop input too
  const d = document.getElementById('mapSearch');
  if (d) d.value = e.target.value;
});

// Resize
window.addEventListener('resize', applyResponsive);

// ── Init ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  UrigodMap.init('fullMap', { center:[41.710,44.790], zoom:13, restaurants:RESTAURANTS });
  applyResponsive();
  applyI18n();
  updateSlider();
});
</script>
</body>
</html>
